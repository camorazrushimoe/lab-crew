name: ${TEAM_NAME:-lab-crew}

# Lab Crew — Office-attached mode.
#
# Research team: turns fuzzy ideas into research questions, hypotheses, and
# Research Packages handed off to the Office (which routes to Spec/Dev).
# Lab teams do not need a private dev-cluster — workspace is enough.
#
# Agents join the Agent Office shared bus (external network agent-office-crew);
# no local Redis. Containers are lifecycle-controller-managed (restart: "no").
#
# Env (from .env — see .env.example):
#   TEAM_NAME         instance id (default: lab-crew)
#   OFFICE_BUS_URL    Office Redis (default: redis://shared-memory:6379)
#   CUSTOM_API_KEY    LLM key (runinfra)
#   DOOR_SECRET_*     per-agent door HMAC secrets
#   LAB_PORT_*        host port overrides (defaults 8651–8653)
#
# Doors: POST /webhooks/inbox on 8644 in-container, host-mapped below.
# Each agent renders its config.yaml from config.yaml.template at start.

services:
  research-lead:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-lab-crew}-research-lead
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/research-lead/hermes-home:/opt/data
      - ./agents/research-lead/skills:/opt/data/skills/lab-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_RESEARCH_LEAD:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-lab-crew}
    ports:
      - "${LAB_PORT_RESEARCH_LEAD:-8651}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  research-engineer:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-lab-crew}-research-engineer
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/research-engineer/hermes-home:/opt/data
      - ./agents/research-engineer/skills:/opt/data/skills/lab-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_RESEARCH_ENGINEER:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-lab-crew}
    ports:
      - "${LAB_PORT_RESEARCH_ENGINEER:-8652}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  evaluation:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-lab-crew}-evaluation
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/evaluation/hermes-home:/opt/data
      - ./agents/evaluation/skills:/opt/data/skills/lab-crew:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_EVALUATION:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-lab-crew}
    ports:
      - "${LAB_PORT_EVALUATION:-8653}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

networks:
  office:
    external: true
    name: agent-office-crew
