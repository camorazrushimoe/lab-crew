name: ${TEAM_NAME:-lab-crew}

# Lab Crew — standalone research factory.
#
# Research team: turns fuzzy ideas into research questions, hypotheses, and
# Research Packages handed off to product engineering (DevCrew).
# Lab teams do not need a private dev-cluster — workspace is enough.
#
# All agents communicate through webhook doors on an internal bridge network
# (lab-crew-net). No external bus or Redis required.
#
# Env (from .env — see .env.example):
#   TEAM_NAME         instance id (default: lab-crew)
#   CUSTOM_API_KEY    LLM key (runinfra)
#   DOOR_SECRET_*     per-agent door HMAC secrets (optional, for agent-to-agent comms)
#   LAB_PORT_*        host port overrides (defaults 8651–8653)
#
# Doors: POST /webhooks/inbox on 8644 in-container, host-mapped below.
# Each agent renders its config.yaml from config.yaml.template at start.

services:
  research-lead:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-lab-crew}-research-lead
    restart: "no"
    networks: [lab-crew-net]
    volumes:
      - ./agents/research-lead/hermes-home:/opt/data
      - ./skills/hypothesis-crafting:/opt/data/skills/lab-crew/hypothesis-crafting:ro
      - ./skills/research-briefing:/opt/data/skills/lab-crew/research-briefing:ro
      - ./skills/research-tracking:/opt/data/skills/lab-crew/research-tracking:ro
      - ./skills/synthesis:/opt/data/skills/lab-crew/synthesis:ro
      - ./skills/handoff:/opt/data/skills/lab-crew/handoff:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_RESEARCH_LEAD:-}
      - TEAM_NAME=${TEAM_NAME:-lab-crew}
    ports:
      - "${LAB_PORT_RESEARCH_LEAD:-8651}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  research-engineer:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-lab-crew}-research-engineer
    restart: "no"
    networks: [lab-crew-net]
    volumes:
      - ./agents/research-engineer/hermes-home:/opt/data
      - ./skills/experiment-design:/opt/data/skills/lab-crew/experiment-design:ro
      - ./skills/quick-parsing:/opt/data/skills/lab-crew/quick-parsing:ro
      - ./skills/data-collection:/opt/data/skills/lab-crew/data-collection:ro
      - ./skills/exploratory-analysis:/opt/data/skills/lab-crew/exploratory-analysis:ro
      - ./skills/reproducible-notes:/opt/data/skills/lab-crew/reproducible-notes:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_RESEARCH_ENGINEER:-}
      - TEAM_NAME=${TEAM_NAME:-lab-crew}
    ports:
      - "${LAB_PORT_RESEARCH_ENGINEER:-8652}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  evaluation:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-lab-crew}-evaluation
    restart: "no"
    networks: [lab-crew-net]
    volumes:
      - ./agents/evaluation/hermes-home:/opt/data
      - ./skills/metric-design:/opt/data/skills/lab-crew/metric-design:ro
      - ./skills/auto-eval:/opt/data/skills/lab-crew/auto-eval:ro
      - ./skills/human-grading:/opt/data/skills/lab-crew/human-grading:ro
      - ./skills/evaluation-critique:/opt/data/skills/lab-crew/evaluation-critique:ro
      - ./skills/eval-reporting:/opt/data/skills/lab-crew/eval-reporting:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_EVALUATION:-}
      - TEAM_NAME=${TEAM_NAME:-lab-crew}
    ports:
      - "${LAB_PORT_EVALUATION:-8653}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

networks:
  lab-crew-net:
    driver: bridge
